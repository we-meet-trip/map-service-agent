name: runtime image audit

on:
  push:
    paths:
      - Dockerfile
      - requirements.txt
      - scripts/verify-headless-runtime.py
      - .github/workflows/runtime-image-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the selected source commit
        run: docker build --tag map-runtime:audit .
      - name: Verify image identity and removed runtime packages
        run: |
          mkdir reports
          docker image inspect map-runtime:audit > reports/image-inspect.json
          git rev-parse HEAD > reports/source-sha.txt
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,size=64m --entrypoint sh map-runtime:audit -ec '
            test "$(id -u)" = 10001
            test ! -e /usr/bin/perl
            test -z "$(find /usr/bin /usr/sbin -xdev -type f -perm /6000 -print -quit)"
            python -m pip check
          '
      - name: Scan exact built image (findings remain release blockers)
        run: |
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' map-runtime:audit)
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --image-src docker --platform linux/amd64 --timeout 15m --no-progress --scanners vuln --severity HIGH,CRITICAL --format json --output /reports/trivy.json "$IMAGE_ID"
          python - <<'PYCODE'
          import collections,json,os
          from pathlib import Path
          p=json.loads(Path('reports/trivy.json').read_text())
          i=json.loads(Path('reports/image-inspect.json').read_text())[0]
          assert p['Metadata']['ImageID']==i['Id']
          vs=[v for r in p.get('Results',[]) for v in r.get('Vulnerabilities',[])]
          counts=dict(collections.Counter(v['Severity'] for v in vs))
          summary={'source_sha':os.environ['GITHUB_SHA'],'image_id':i['Id'],'counts':counts,'security_status':'FINDINGS_REQUIRE_REVIEW' if vs else 'NO_HIGH_CRITICAL_IN_SCAN_SCOPE','registry_published':False}
          Path('reports/summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Exact runtime vulnerability inventory (build success is not release approval)\n\n```json\n'+json.dumps(summary,indent=2)+'\n```\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-image-audit-${{ github.sha }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
