name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "검사할 branch/tag/SHA. 비우면 실행 workflow의 ref"
        type: string
        default: ""
      build_image:
        description: "Docker 런타임 빌드 검사 (레지스트리 게시 없음)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: import runtime
        run: python -c "import app.main"
      - name: test
        run: python -m pytest -q
      - name: build runtime image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image }}
        run: docker build --tag map-runtime:ci .
